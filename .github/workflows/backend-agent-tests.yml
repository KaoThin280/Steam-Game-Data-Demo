name: Backend agent tests

on:
  push:
    paths: ["back_end/**", ".github/workflows/backend-agent-tests.yml"]
  pull_request:
    paths: ["back_end/**", ".github/workflows/backend-agent-tests.yml"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back_end
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_URL_READONLY: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            back_end/requirements.txt
            back_end/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests
