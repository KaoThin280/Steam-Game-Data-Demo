name: Build tested Docker release (manual VPS rollout)

# Publishing code cannot restart the VPS. Rollout is performed by the operator.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: steam-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            back_end/requirements.txt
            back_end/requirements-test.txt
      - name: Unit and regression tests (no production credentials)
        working-directory: back_end
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_URL_READONLY: postgresql://test:test@localhost:5432/test
          REDIS_URL: rediss://localhost:6379/0
          DEBUG: "true"
          ERROR_NOTIFICATIONS_ENABLED: "false"
          OPENROUTER_API_KEY: ""
          E2B_API_KEY: ""
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests
      - name: Build Linux amd64 runtime
        run: docker build --platform linux/amd64 -t "$IMAGE" ./back_end
      - name: Check non-root runtime without network
        run: |
          docker run --rm --network none --memory 384m --memory-swap 384m --cpus 0.12 -e DEBUG=true -e DATABASE_URL=postgresql://test:test@localhost/test -e DATABASE_URL_READONLY=postgresql://reader:test@localhost/test -e REDIS_URL=redis://localhost:6379/0 -e RAG_ENABLED=true "$IMAGE" python -c 'import os; import app.main, app.mcp_server; from app.services.knowledge_retrieval import PineconeKnowledgeRetriever; from pinecone import AsyncPinecone; assert os.getuid() == 1000; print("APP AND RAG IMPORT OK")'
      - name: Package release (no environment secrets)
        run: |
          mkdir release
          docker save "$IMAGE" | gzip > release/backend-image.tar.gz
          cp back_end/compose.production.yml release/
          cp back_end/.env.production.example release/production.env.example
          printf '%s\n' "$IMAGE" > release/image-tag.txt
          cp docs/operations/docker-vps-migration.md release/README.md
          cp docs/operations/rag-vps-release.md release/RAG-UPDATE.md
          cd release
          sha256sum backend-image.tar.gz compose.production.yml production.env.example image-tag.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: steam-backend-${{ github.sha }}
          path: release/
          retention-days: 7
          if-no-files-found: error
