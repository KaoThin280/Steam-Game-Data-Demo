name: Deploy Backend to GCP VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'back_end/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_IP }}
        username: thinhthinhhay2002
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # 1. Di chuyển vào thư mục dự án
          cd ~/my-project
          
          # 2. Đồng bộ cứng mã nguồn với GitHub (Tránh kẹt tiến trình)
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Đi vào thư mục back_end
          cd back_end
          
          # 4. Khởi tạo/Cập nhật môi trường ảo venv và cài đặt thư viện
          python3 -m venv venv || true
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # 5. Giải phóng cổng mạng 8000
          fuser -k 8000/tcp || true
          sleep 2
          
          # 6. Khởi chạy ngầm Uvicorn bằng Python chuẩn bên trong venv
          nohup ./venv/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          sleep 8
          
          echo "=== KIỂM TRA TRẠNG THÁI KHỞI ĐỘNG ==="
          tail -n 15 uvicorn.log