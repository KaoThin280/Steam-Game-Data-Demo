# Nginx configuration for the Steam Game Data API.
# This file assumes nginx is in front of the FastAPI app (uvicorn) and
# terminates SSL using Let''s Encrypt certs. Adjust paths / domain as needed.

# Rate limit zone (10 req/s per IP, burst 20).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream - the FastAPI app running on Cloud Run or local uvicorn.
upstream fastapi_backend {
    # If behind Cloud Run, the X-Forwarded-* headers are pre-set.
    # For local dev, use:
    # server 127.0.0.1:8000;
    server unix:/tmp/uvicorn.sock fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    # Redirect all HTTP -> HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==== Security headers (belt-and-braces on top of the FastAPI middleware) ====
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src ''self''; frame-ancestors ''none''" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version.
    server_tokens off;

    # ==== Rate limiting for /api/* ====
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Long timeouts for AI endpoints (up to 90s).
        proxy_connect_timeout 60s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # ==== Static temp_data files (rare; main app uses signed URLs) ====
    # If you still want to expose temp_data through nginx, uncomment:
    # location /api/v1/temp_data/ {
    #     alias /var/www/steam-game-data/temp_data/;
    #     autoindex off;
    #     expires 1h;
    # }

    # ==== Health check (no rate limit) ====
    location = /health {
        proxy_pass http://fastapi_backend;
        access_log off;
    }

    # ==== File upload size limit (matches FastAPI) ====
    client_max_body_size 20M;

    # ==== Gzip ====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}