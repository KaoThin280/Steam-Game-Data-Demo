services:
  mcp:
    build: .
    env_file: .env
    command: ["uvicorn", "app.mcp_server:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp:8001/mcp
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
